[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litter-edge"
version = "0.7.0"
description = "Portable edge litter detection, classification, tracking, and counting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Abiola A. Babsalaam" },
]
keywords = [
  "edge-ai",
  "litter-detection",
  "object-detection",
  "grounding-dino",
  "rfdetr",
  "computer-vision",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
public-model = [
  "torch>=2.2",
  "transformers>=4.56,<6",
  "Pillow>=10,<13",
]
rfdetr = [
  "rfdetr>=1.10,<1.11",
]
train = [
  "rfdetr[train,loggers]>=1.10,<1.11",
]
runtime = [
  "numpy==1.26.4",
  "opencv-python>=4.10,<5",
]
runtime-headless = [
  "numpy==1.26.4",
  "opencv-python-headless>=4.10,<5",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
]

[project.scripts]
litter-train = "litter_edge.train:main"
litter-evaluate = "litter_edge.evaluate:main"
litter-evaluate-counts = "litter_edge.evaluate_counts:main"
litter-discover = "litter_edge.discover:main"
litter-download-model = "litter_edge.model_fetch:main"
litter-query-counts = "litter_edge.query:main"
litter-export = "litter_edge.export:main"
litter-infer = "litter_edge.infer:main"
litter-benchmark = "litter_edge.benchmark:main"
litter-serve = "litter_edge.serve:main"

[project.urls]
Homepage = "https://github.com/biolababs/edge-litter-detection"
Repository = "https://github.com/biolababs/edge-litter-detection"
Documentation = "https://github.com/biolababs/edge-litter-detection#readme"
Issues = "https://github.com/biolababs/edge-litter-detection/issues"

[tool.setuptools.packages.find]
where = ["src"]

