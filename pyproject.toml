[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litter-edge"
version = "0.10.1"
description = "Portable edge litter detection, classification, tracking, and counting"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-NOTICE.md"]
authors = [
  { name = "Abiola A. Babsalaam" },
]
keywords = [
  "edge-ai",
  "litter-detection",
  "object-detection",
  "grounding-dino",
  "omdet-turbo",
  "rfdetr",
  "computer-vision",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
public-model = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0,<2",
  "transformers>=4.56,<5",
  "Pillow>=13,<14; python_version >= '3.11'",
  "Pillow>=12.3,<13; python_version < '3.11'",
]
rfdetr = [
  "rfdetr>=1.10,<1.11",
]
train = [
  "rfdetr[train,loggers]>=1.10,<1.11",
]
runtime = [
  "numpy==1.26.4; python_version < '3.13'",
  "numpy>=2.4,<3; python_version >= '3.13'",
  "opencv-python>=4.10,<5",
]
runtime-headless = [
  "numpy==1.26.4; python_version < '3.13'",
  "numpy>=2.4,<3; python_version >= '3.13'",
  "opencv-python-headless>=4.10,<5",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
]
dev = [
  "bandit==1.9.4",
  "defusedxml>=0.7,<1",
  "httpx>=0.27,<1",
  "pip-audit==2.10.1",
  "ruff==0.17.1",
]

[project.scripts]
litter-train = "litter_edge.train:main"
litter-evaluate = "litter_edge.evaluate:main"
litter-evaluate-counts = "litter_edge.evaluate_counts:main"
litter-discover = "litter_edge.discover:main"
litter-download-model = "litter_edge.model_fetch:main"
litter-prepare-test-data = "litter_edge.demo_data:main"
litter-prepare-demo-video = "litter_edge.demo_video:main"
litter-prepare-training-data = "litter_edge.training_data:main"
litter-query-counts = "litter_edge.query:main"
litter-export = "litter_edge.export:main"
litter-infer = "litter_edge.infer:main"
litter-benchmark = "litter_edge.benchmark:main"
litter-serve = "litter_edge.serve:main"

[project.urls]
Homepage = "https://github.com/biolababs/edge-litter-detection"
Repository = "https://github.com/biolababs/edge-litter-detection"
Documentation = "https://github.com/biolababs/edge-litter-detection#readme"
Issues = "https://github.com/biolababs/edge-litter-detection/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litter_edge = [
  "dashboard/*.html",
  "dashboard/*.css",
  "dashboard/*.js",
  "dashboard/*.svg",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

