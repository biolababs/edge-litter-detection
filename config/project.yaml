project_name: litter
# Public open-vocabulary defaults: no private checkpoint or training is needed.
# Transformers downloads and caches this model on first use.
backend: grounding_dino
model: IDEA-Research/grounding-dino-tiny
class_names: config/classes.yaml
task: detect
image_size: 640
device: auto
confidence: 0.25
iou: 0.45
max_detections: 100
tracking:
  enabled: true
  method: class_stabilized_iou
  iou_threshold: 0.30
  max_missed_frames: 30
  min_confirmed_hits: 2
  class_mismatch_penalty: 0.75
separation:
  policy: config/separation.yaml
storage:
  database: state/litter-edge.db
  flush_frames: 15
  persist_detections: false
target:
  device: jetson-orin-nano-8gb-super
  board: p3768-0000+p3767-0005-super
  architecture: aarch64
  cpu: 6-core-cortex-a78ae
  os: ubuntu-22.04.5
  kernel: 5.15.199-tegra
  jetpack: 6.2.3
  l4t: 36.5.2
  python: 3.10.12
  tensorrt_python: 10.3.0
  precision: fp16
  engine_workspace_gb: 1
  power_mode: MAXN_SUPER
  deployment_authorized: false
  shared_device: true
  observed_memory_gb:
    total: 7.4
    used: 2.5
    available: 4.5
  storage:
    root_device: nvme
    root_available_gb: 772
    data_device_available_gb: 231.4
  installed_runtime:
    tensorrt_python: true
    docker: true
    torch: false
    transformers: false
    grounding_dino: false
    rfdetr: false
    nvcc: false
    trtexec: false
  camera_devices: none_observed
  existing_workload:
    - local_llm_inference
    - application_services
    - development_tools

implementation:
  model_family: grounding_dino
  variant: tiny
  purpose: litter_detection_classification_and_counting
  model_comparison_in_scope: false

# Not used by startup.sh or the public model. This section exists only for
# teams that intentionally choose to build an optional closed-set RF-DETR
# checkpoint from licensed representative data.
custom_training:
  backend: rfdetr
  base_model: rfdetr-nano
  image_size: 640
  epochs: 100
  batch: 4
  workers: 8
  seed: 42
  deterministic: true
  patience: 30
  output_dir: runs/litter
  run_name: rfdetr-nano-custom

validation:
  accuracy_metrics:
    - precision
    - recall
    - f1
    - map50
    - map50_95
    - per_class_ap
    - visible_count_mae
    - unique_session_count_error
  operational_gates:
    minimum_test_recall: pending_validation
    minimum_sustained_fps: 15
    maximum_p95_latency_ms: pending_camera_pipeline
    preferred_incremental_memory_gb: 1.5
    maximum_incremental_memory_gb: 2.0
    minimum_remaining_available_memory_gb: 2.0
    no_sustained_thermal_throttling: true


