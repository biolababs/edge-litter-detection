services:
  litter-api:
    build:
      context: .
    environment:
      LITTER_BACKEND: grounding_dino
      LITTER_MODEL: IDEA-Research/grounding-dino-tiny
      LITTER_CLASSES: /app/config/classes.yaml
      LITTER_DEVICE: cpu
      LITTER_DATABASE: /app/state/litter-edge.db
      LITTER_EDGE_DEVICE_ID: container-edge
      LITTER_HOST: 0.0.0.0
      LITTER_PORT: "8088"
    ports:
      - "8088:8088"
    volumes:
      - litter-state:/app/state
      - litter-model-cache:/home/litter/.cache
    restart: unless-stopped

volumes:
  litter-state:
  litter-model-cache:
