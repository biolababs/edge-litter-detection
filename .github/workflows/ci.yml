name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: >-
          python -m pip install
          build
          bandit==1.9.4
          "httpx>=0.27,<1"
          "PyYAML>=6,<7"
          ruff==0.17.1
          "fastapi>=0.115,<1"
          "uvicorn>=0.32,<1"
      - run: python -m build
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: ruff check src tests scripts *.py
      - run: bandit -q -r src scripts -ll
      - run: PYTHONPATH=src python scripts/validate_release.py
      - run: PYTHONPATH=src python -m compileall -q src tests scripts *.py
      - run: bash -n startup.sh
      - run: bash tests/test_startup.sh
      - run: ./startup.sh --help
      - run: python infer.py --help
      - run: python discover_sources.py --help
      - run: python prepare_test_data.py --help
      - run: python prepare_demo_video.py --help
      - run: python prepare_training_data.py --help
      - run: python download_model.py --help
      - run: python query_counts.py --help
      - run: python train.py --help
      - run: python evaluate.py --help
      - run: python evaluate_counts.py --help
      - run: python export_model.py --help
      - run: python benchmark.py --help
      - run: python serve.py --help
      - run: PYTHONPATH=src python -c "from litter_edge.api import app; assert len(app.routes) >= 10"
