name: ci

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python scripts/validate_release.py
      - run: PYTHONPATH=src python -m compileall -q src tests scripts *.py
      - run: python infer.py --help
      - run: python train.py --help
      - run: python evaluate.py --help
      - run: python evaluate_counts.py --help
      - run: python export_model.py --help
      - run: python benchmark.py --help
