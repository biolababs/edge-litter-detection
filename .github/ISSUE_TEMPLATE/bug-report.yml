name: Bug report
description: Report a reproducible defect in detection, counting, storage, API, or deployment.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove stream credentials, private imagery, IP addresses, and identifying route or vehicle data.
  - type: input
    id: revision
    attributes:
      label: Git revision
      placeholder: Output of git rev-parse --short HEAD
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or startup
        - Detection or classification
        - Tracking or counting
        - Dashboard or API
        - SQLite or integration events
        - Training or evaluation
        - Deployment or device support
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment
      description: OS, Python, backend, device, camera/input type, and relevant package versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private media, personal data, and sensitive infrastructure details.
          required: true

