<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Litter count semantics</title>
  <desc id="desc">Four distinct count quantities progress from frame detections to independently confirmed collection.</desc>
  <defs>

  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .group{fill:#ffffff;stroke:#374151;stroke-width:1.5}
    .boundary{fill:#f8fafc;stroke:#111827;stroke-width:1.8}
    .node{fill:#ffffff;stroke:#4b5563;stroke-width:1.35}
    .soft{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.25}
    .accent{fill:#eaf0f8;stroke:#2f5597;stroke-width:1.5}
    .safety{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}
    .gate{fill:#ffffff;stroke:#111827;stroke-width:1.6}
    .arrow{fill:none;stroke:#374151;stroke-width:1.6;marker-end:url(#arrow)}
    .feedback{fill:none;stroke:#4b5563;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    .blocked{fill:none;stroke:#9a3412;stroke-width:1.8;stroke-dasharray:7 5}
    .axis{stroke:#6b7280;stroke-width:1}
    .grid{stroke:#d1d5db;stroke-width:1}
    .section{font-size:18px;font-weight:700;letter-spacing:.3px}
    .label{font-size:17px}
    .small{font-size:16.5px;fill:#374151}
    .tiny{font-size:14px;fill:#4b5563}
    .number{font-size:13px;font-weight:700;fill:#ffffff}
    .metric{font-size:21px;font-weight:700}
    .panel{font-size:20px;font-weight:700}
    .bar1{fill:#2f5597}
    .bar2{fill:#64748b}
    .bar3{fill:#94a3b8}
    .bar4{fill:#cbd5e1}
    .bar5{fill:#e5e7eb;stroke:#9ca3af;stroke-width:.7}
  </style>

    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>
<rect class="node" x="30" y="55" width="250" height="235" rx="0"/>
<circle cx="54" cy="79" r="11" fill="#2f5597"/><text class="number" x="54" y="83.5" text-anchor="middle">1</text>
<text class="metric" x="155" y="92" text-anchor="middle">D_t</text>
<text class="section" x="155" y="132" text-anchor="middle">Frame detections</text>
<text class="small" x="155" y="170" text-anchor="middle">Objects reported</text>
<text class="small" x="155" y="190" text-anchor="middle">in frame t</text>
<text class="small" x="155" y="235" text-anchor="middle">What is visible now?</text>
<path class="arrow" d="M280 172 L322 172"/>
<rect class="node" x="322" y="55" width="250" height="235" rx="0"/>
<circle cx="346" cy="79" r="11" fill="#2f5597"/><text class="number" x="346" y="83.5" text-anchor="middle">2</text>
<text class="metric" x="447" y="92" text-anchor="middle">V_t</text>
<text class="section" x="447" y="132" text-anchor="middle">Confirmed visible</text>
<text class="small" x="447" y="170" text-anchor="middle">Tracks satisfying</text>
<text class="small" x="447" y="190" text-anchor="middle">the hit rule</text>
<text class="small" x="447" y="235" text-anchor="middle">What is stable now?</text>
<path class="arrow" d="M572 172 L614 172"/>
<rect class="node" x="614" y="55" width="250" height="235" rx="0"/>
<circle cx="638" cy="79" r="11" fill="#2f5597"/><text class="number" x="638" y="83.5" text-anchor="middle">3</text>
<text class="metric" x="739" y="92" text-anchor="middle">U_r</text>
<text class="section" x="739" y="132" text-anchor="middle">Unique in run</text>
<text class="small" x="739" y="170" text-anchor="middle">Confirmed track IDs</text>
<text class="small" x="739" y="190" text-anchor="middle">counted once</text>
<text class="small" x="739" y="235" text-anchor="middle">What did run r see?</text>
<path class="arrow" d="M864 172 L906 172"/>
<rect class="node" x="906" y="55" width="250" height="235" rx="0"/>
<circle cx="930" cy="79" r="11" fill="#2f5597"/><text class="number" x="930" y="83.5" text-anchor="middle">4</text>
<text class="metric" x="1031" y="92" text-anchor="middle">P_r</text>
<text class="section" x="1031" y="132" text-anchor="middle">Confirmed collected</text>
<text class="small" x="1031" y="170" text-anchor="middle">Pickup confirmed by</text>
<text class="small" x="1031" y="190" text-anchor="middle">human/controller</text>
<text class="small" x="1031" y="235" text-anchor="middle">What was collected?</text>
<text class="tiny" x="306" y="45" text-anchor="middle">track confirmation</text>
<text class="tiny" x="598" y="45" text-anchor="middle">run-level deduplication</text>
<text class="tiny" x="890" y="45" text-anchor="middle">independent evidence</text>
<rect class="soft" x="130" y="335" width="940" height="62" rx="0"/>
<text class="small" x="600" y="363" text-anchor="middle">D_t, V_t, U_r and P_r are stored as distinct quantities with run, device, route and time context.</text>
<text class="small" x="600" y="386" text-anchor="middle">Frame detections must not be reported as unique physical objects or confirmed cleanup.</text>
</svg>
