<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Deployment and machinery-safety boundary</title>
  <desc id="desc">The perception application emits an advisory event while an independent safety controller retains actuation authority and returns pickup confirmation.</desc>
  <defs>

  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .group{fill:#ffffff;stroke:#374151;stroke-width:1.5}
    .boundary{fill:#f8fafc;stroke:#111827;stroke-width:1.8}
    .node{fill:#ffffff;stroke:#4b5563;stroke-width:1.35}
    .soft{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.25}
    .accent{fill:#eaf0f8;stroke:#2f5597;stroke-width:1.5}
    .safety{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}
    .gate{fill:#ffffff;stroke:#111827;stroke-width:1.6}
    .arrow{fill:none;stroke:#374151;stroke-width:1.6;marker-end:url(#arrow)}
    .feedback{fill:none;stroke:#4b5563;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    .blocked{fill:none;stroke:#9a3412;stroke-width:1.8;stroke-dasharray:7 5}
    .axis{stroke:#6b7280;stroke-width:1}
    .grid{stroke:#d1d5db;stroke-width:1}
    .section{font-size:18px;font-weight:700;letter-spacing:.3px}
    .label{font-size:17px}
    .small{font-size:16.5px;fill:#374151}
    .tiny{font-size:14px;fill:#4b5563}
    .number{font-size:13px;font-weight:700;fill:#ffffff}
    .metric{font-size:21px;font-weight:700}
    .panel{font-size:20px;font-weight:700}
    .bar1{fill:#2f5597}
    .bar2{fill:#64748b}
    .bar3{fill:#94a3b8}
    .bar4{fill:#cbd5e1}
    .bar5{fill:#e5e7eb;stroke:#9ca3af;stroke-width:.7}
  </style>

    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="530" fill="#ffffff"/>
<rect class="boundary" x="35" y="48" width="490" height="410" rx="0"/>
<text class="panel" x="60" y="80" text-anchor="start">(a) PERCEPTION APPLICATION</text>
<text class="small" x="60" y="105" text-anchor="start">advisory; not safety-rated</text>
<rect class="node" x="85" y="145" width="145" height="68" rx="0"/>
<text class="small" x="157" y="174" text-anchor="middle">Camera</text>
<text class="small" x="157" y="193" text-anchor="middle">and source checks</text>
<rect class="node" x="300" y="145" width="165" height="68" rx="0"/>
<text class="small" x="382" y="174" text-anchor="middle">Detection / tracking</text>
<text class="small" x="382" y="193" text-anchor="middle">candidate object</text>
<path class="arrow" d="M230 179 L300 179"/>
<rect class="accent" x="175" y="280" width="210" height="72" rx="0"/>
<text class="small" x="280" y="310" text-anchor="middle">Advisory candidate event</text>
<text class="small" x="280" y="330" text-anchor="middle">position · class · confidence</text>
<path class="arrow" d="M382 213 L382 245 L280 245 L280 280"/>
<rect class="group" x="675" y="48" width="490" height="410" rx="0"/>
<text class="panel" x="700" y="80" text-anchor="start">(b) INDEPENDENT SAFETY CONTROL</text>
<text class="small" x="700" y="105" text-anchor="start">separate authority and validation</text>
<rect class="soft" x="715" y="135" width="175" height="115" rx="0"/>
<text class="small" x="802" y="163" text-anchor="middle">Safety inputs</text>
<text class="small" x="802" y="182" text-anchor="middle">e-stop · exclusion zone</text>
<text class="small" x="802" y="201" text-anchor="middle">arm state · load limits</text>
<text class="small" x="802" y="220" text-anchor="middle">stale-signal checks</text>
<rect class="safety" x="955" y="150" width="150" height="82" rx="0"/>
<text class="small" x="1030" y="182" text-anchor="middle">Safety logic</text>
<text class="small" x="1030" y="202" text-anchor="middle">permit / inhibit</text>
<path class="arrow" d="M890 191 L955 191"/>
<rect class="safety" x="955" y="305" width="150" height="72" rx="0"/>
<text class="small" x="1030" y="334" text-anchor="middle">Actuator</text>
<text class="small" x="1030" y="354" text-anchor="middle">collection mechanism</text>
<path class="arrow" d="M1030 232 L1030 305"/>
<path class="arrow" d="M525 316 L675 316"/>
<text class="tiny" x="600" y="287" text-anchor="middle">bounded advisory interface</text>
<path class="blocked" d="M385 340 L600 340 L600 410 L955 410 L955 355"/>
<text class="small" x="770" y="431" text-anchor="middle">no direct perception-to-actuation path</text>
<text class="metric" x="600" y="415" text-anchor="middle">×</text>
<path class="feedback" d="M955 355 L920 355 L920 485 L280 485 L280 352"/>
<text class="small" x="600" y="505" text-anchor="middle">positive pickup confirmation returns to the evidence store</text>
</svg>
