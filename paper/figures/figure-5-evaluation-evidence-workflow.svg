<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Use-case evaluation and evidence workflow</title>
  <desc id="desc">Detection, counting and edge-system evaluations are separated and joined into one traceable evidence bundle.</desc>
  <defs>

  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .group{fill:#ffffff;stroke:#374151;stroke-width:1.5}
    .boundary{fill:#f8fafc;stroke:#111827;stroke-width:1.8}
    .node{fill:#ffffff;stroke:#4b5563;stroke-width:1.35}
    .soft{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.25}
    .accent{fill:#eaf0f8;stroke:#2f5597;stroke-width:1.5}
    .safety{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}
    .gate{fill:#ffffff;stroke:#111827;stroke-width:1.6}
    .arrow{fill:none;stroke:#374151;stroke-width:1.6;marker-end:url(#arrow)}
    .feedback{fill:none;stroke:#4b5563;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    .blocked{fill:none;stroke:#9a3412;stroke-width:1.8;stroke-dasharray:7 5}
    .axis{stroke:#6b7280;stroke-width:1}
    .grid{stroke:#d1d5db;stroke-width:1}
    .section{font-size:18px;font-weight:700;letter-spacing:.3px}
    .label{font-size:17px}
    .small{font-size:16.5px;fill:#374151}
    .tiny{font-size:14px;fill:#4b5563}
    .number{font-size:13px;font-weight:700;fill:#ffffff}
    .metric{font-size:21px;font-weight:700}
    .panel{font-size:20px;font-weight:700}
    .bar1{fill:#2f5597}
    .bar2{fill:#64748b}
    .bar3{fill:#94a3b8}
    .bar4{fill:#cbd5e1}
    .bar5{fill:#e5e7eb;stroke:#9ca3af;stroke-width:.7}
  </style>

    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
<rect class="accent" x="315" y="35" width="570" height="65" rx="0"/>
<text class="small" x="600" y="62" text-anchor="middle">Frozen use-case definition</text>
<text class="small" x="600" y="83" text-anchor="middle">taxonomy · split · thresholds · hardware condition</text>
<path class="arrow" d="M600 100 L600 130 L205 130 L205 165"/>
<path class="arrow" d="M600 130 L600 165"/>
<path class="arrow" d="M600 130 L995 130 L995 165"/>
<rect class="group" x="35" y="165" width="340" height="250" rx="0"/>
<text class="section" x="205" y="195" text-anchor="middle">(a) DETECTION / CLASSIFICATION</text>
<text class="small" x="205" y="235" text-anchor="middle">Inputs</text>
<text class="small" x="205" y="255" text-anchor="middle">held-out labelled images</text>
<text class="small" x="205" y="275" text-anchor="middle"></text>
<text class="small" x="205" y="295" text-anchor="middle">Metrics</text>
<text class="small" x="205" y="315" text-anchor="middle">COCO AP/AR · precision · recall</text>
<text class="small" x="205" y="335" text-anchor="middle">per-class support · error pairs</text>
<text class="small" x="205" y="355" text-anchor="middle"></text>
<text class="small" x="205" y="375" text-anchor="middle">Artifacts</text>
<text class="small" x="205" y="395" text-anchor="middle">predictions · checksums</text>
<rect class="group" x="430" y="165" width="340" height="250" rx="0"/>
<text class="section" x="600" y="195" text-anchor="middle">(b) TRACKING / COUNTING</text>
<text class="small" x="600" y="235" text-anchor="middle">Inputs</text>
<text class="small" x="600" y="255" text-anchor="middle">track-annotated video</text>
<text class="small" x="600" y="275" text-anchor="middle"></text>
<text class="small" x="600" y="295" text-anchor="middle">Metrics</text>
<text class="small" x="600" y="315" text-anchor="middle">visible-count error</text>
<text class="small" x="600" y="335" text-anchor="middle">unique-count error · ID failures</text>
<text class="small" x="600" y="355" text-anchor="middle"></text>
<text class="small" x="600" y="375" text-anchor="middle">Artifacts</text>
<text class="small" x="600" y="395" text-anchor="middle">track events · count evidence</text>
<rect class="group" x="825" y="165" width="340" height="250" rx="0"/>
<text class="section" x="995" y="195" text-anchor="middle">(c) EDGE SYSTEM</text>
<text class="small" x="995" y="235" text-anchor="middle">Inputs</text>
<text class="small" x="995" y="255" text-anchor="middle">fixed device and source condition</text>
<text class="small" x="995" y="275" text-anchor="middle"></text>
<text class="small" x="995" y="295" text-anchor="middle">Metrics</text>
<text class="small" x="995" y="315" text-anchor="middle">latency · throughput · memory</text>
<text class="small" x="995" y="335" text-anchor="middle">power · thermal · endurance</text>
<text class="small" x="995" y="355" text-anchor="middle"></text>
<text class="small" x="995" y="375" text-anchor="middle">Artifacts</text>
<text class="small" x="995" y="395" text-anchor="middle">profiles · telemetry · logs</text>
<rect class="soft" x="255" y="465" width="690" height="65" rx="0"/>
<text class="small" x="600" y="491" text-anchor="middle">Evidence bundle</text>
<text class="small" x="600" y="512" text-anchor="middle">environment · model revision · Git revision · configuration · SHA-256</text>
<path class="arrow" d="M205 415 L430 497"/>
<path class="arrow" d="M600 415 L600 465"/>
<path class="arrow" d="M995 415 L770 497"/>
</svg>
