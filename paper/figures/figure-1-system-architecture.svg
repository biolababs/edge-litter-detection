<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Detector-independent operational architecture</title>
  <desc id="desc">A publication-style block diagram of sources, the non-safety-rated edge runtime, operational users, and the separate confirmation path.</desc>
  <defs>

  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .group{fill:#ffffff;stroke:#374151;stroke-width:1.5}
    .boundary{fill:#f8fafc;stroke:#111827;stroke-width:1.8}
    .node{fill:#ffffff;stroke:#4b5563;stroke-width:1.35}
    .soft{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.25}
    .accent{fill:#eaf0f8;stroke:#2f5597;stroke-width:1.5}
    .safety{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}
    .gate{fill:#ffffff;stroke:#111827;stroke-width:1.6}
    .arrow{fill:none;stroke:#374151;stroke-width:1.6;marker-end:url(#arrow)}
    .feedback{fill:none;stroke:#4b5563;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    .blocked{fill:none;stroke:#9a3412;stroke-width:1.8;stroke-dasharray:7 5}
    .axis{stroke:#6b7280;stroke-width:1}
    .grid{stroke:#d1d5db;stroke-width:1}
    .section{font-size:18px;font-weight:700;letter-spacing:.3px}
    .label{font-size:17px}
    .small{font-size:16.5px;fill:#374151}
    .tiny{font-size:14px;fill:#4b5563}
    .number{font-size:13px;font-weight:700;fill:#ffffff}
    .metric{font-size:21px;font-weight:700}
    .panel{font-size:20px;font-weight:700}
    .bar1{fill:#2f5597}
    .bar2{fill:#64748b}
    .bar3{fill:#94a3b8}
    .bar4{fill:#cbd5e1}
    .bar5{fill:#e5e7eb;stroke:#9ca3af;stroke-width:.7}
  </style>

    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
<rect class="group" x="28" y="45" width="185" height="520" rx="0"/>
<text class="section" x="120" y="76" text-anchor="middle">INPUT SOURCES</text>
<rect class="node" x="48" y="105" width="145" height="58" rx="0"/>
<text class="small" x="120" y="130" text-anchor="middle">Camera</text>
<text class="small" x="120" y="148" text-anchor="middle">USB / CSI</text>
<rect class="node" x="48" y="180" width="145" height="58" rx="0"/>
<text class="small" x="120" y="205" text-anchor="middle">Image</text>
<text class="small" x="120" y="223" text-anchor="middle">local / HTTP</text>
<rect class="node" x="48" y="255" width="145" height="58" rx="0"/>
<text class="small" x="120" y="280" text-anchor="middle">Video</text>
<text class="small" x="120" y="298" text-anchor="middle">file / URL</text>
<rect class="node" x="48" y="330" width="145" height="58" rx="0"/>
<text class="small" x="120" y="355" text-anchor="middle">Stream</text>
<text class="small" x="120" y="373" text-anchor="middle">RTSP / HTTP</text>
<rect class="boundary" x="250" y="45" width="670" height="520" rx="0"/>
<text class="section" x="275" y="76" text-anchor="start">EDGE RUNTIME (NON-SAFETY-RATED)</text>
<rect class="accent" x="285" y="115" width="165" height="72" rx="0"/>
<circle cx="297" cy="127" r="11" fill="#2f5597"/><text class="number" x="297" y="131.5" text-anchor="middle">1</text>
<text class="small" x="368" y="143" text-anchor="middle">Capture adapter</text>
<text class="small" x="368" y="163" text-anchor="middle">decode · validate</text>
<rect class="accent" x="500" y="115" width="165" height="72" rx="0"/>
<circle cx="512" cy="127" r="11" fill="#2f5597"/><text class="number" x="512" y="131.5" text-anchor="middle">2</text>
<text class="small" x="583" y="143" text-anchor="middle">Detector adapter</text>
<text class="small" x="583" y="163" text-anchor="middle">public / custom</text>
<rect class="accent" x="715" y="115" width="165" height="72" rx="0"/>
<circle cx="727" cy="127" r="11" fill="#2f5597"/><text class="number" x="727" y="131.5" text-anchor="middle">3</text>
<text class="small" x="798" y="143" text-anchor="middle">Detection schema</text>
<text class="small" x="798" y="163" text-anchor="middle">class · score · box</text>
<path class="arrow" d="M450 151 L500 151"/>
<path class="arrow" d="M665 151 L715 151"/>
<rect class="node" x="345" y="250" width="210" height="82" rx="0"/>
<circle cx="357" cy="262" r="11" fill="#2f5597"/><text class="number" x="357" y="266.5" text-anchor="middle">4</text>
<text class="small" x="450" y="278" text-anchor="middle">Tracking and counts</text>
<text class="small" x="450" y="298" text-anchor="middle">visible · unique-session</text>
<rect class="node" x="620" y="250" width="210" height="82" rx="0"/>
<circle cx="632" cy="262" r="11" fill="#2f5597"/><text class="number" x="632" y="266.5" text-anchor="middle">5</text>
<text class="small" x="725" y="278" text-anchor="middle">Review and policy</text>
<text class="small" x="725" y="298" text-anchor="middle">confidence · destination</text>
<path class="arrow" d="M798 187 L798 215 L450 215 L450 250"/>
<path class="arrow" d="M798 187 L798 215 L725 215 L725 250"/>
<rect class="soft" x="335" y="405" width="310" height="95" rx="0"/>
<circle cx="347" cy="417" r="11" fill="#2f5597"/><text class="number" x="347" y="421.5" text-anchor="middle">6</text>
<text class="small" x="490" y="433" text-anchor="middle">Durable evidence</text>
<text class="small" x="490" y="452" text-anchor="middle">SQLite · JSONL · reviews</text>
<text class="small" x="490" y="471" text-anchor="middle">confirmed collection</text>
<rect class="soft" x="700" y="405" width="145" height="95" rx="0"/>
<text class="small" x="772" y="440" text-anchor="middle">Local API</text>
<text class="small" x="772" y="460" text-anchor="middle">dashboard · fleet</text>
<path class="arrow" d="M450 332 L450 370 L490 370 L490 405"/>
<path class="arrow" d="M725 332 L725 370 L600 370 L600 405"/>
<path class="arrow" d="M645 452 L700 452"/>
<path class="arrow" d="M213 285 L230 285 L230 151 L285 151"/>
<rect class="group" x="960" y="45" width="212" height="520" rx="0"/>
<text class="section" x="1066" y="76" text-anchor="middle">OPERATIONAL USERS</text>
<rect class="node" x="985" y="120" width="162" height="68" rx="0"/>
<text class="small" x="1066" y="148" text-anchor="middle">Human operator</text>
<text class="small" x="1066" y="167" text-anchor="middle">review / separation</text>
<rect class="node" x="985" y="245" width="162" height="68" rx="0"/>
<text class="small" x="1066" y="273" text-anchor="middle">Fleet system</text>
<text class="small" x="1066" y="292" text-anchor="middle">route / reporting</text>
<rect class="safety" x="985" y="370" width="162" height="90" rx="0"/>
<text class="small" x="1066" y="398" text-anchor="middle">Safety controller</text>
<text class="small" x="1066" y="417" text-anchor="middle">independent authority</text>
<text class="small" x="1066" y="436" text-anchor="middle">pickup confirmation</text>
<path class="arrow" d="M845 452 L940 452 L940 154 L985 154"/>
<path class="arrow" d="M940 279 L985 279"/>
<path class="arrow" d="M940 415 L985 415"/>
<path class="feedback" d="M985 445 L940 445 L940 535 L585 535 L585 500"/>
<text class="tiny" x="730" y="550" text-anchor="middle">confirmed outcome returned as separate evidence</text>
</svg>
