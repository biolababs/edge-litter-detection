<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Top TACO diagnostic class-confusion pairs</title>
  <desc id="desc">Horizontal bars show the ten most frequent wrong-class pairs after score-ordered greedy matching across all classes at intersection over union 0.50. Other litter predicted as food wrapper is the largest pair with 31 cases.</desc>
  <defs>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#18213d}.h{font:700 18px Arial,sans-serif;fill:#18213d}.big{font:700 34px Arial,sans-serif;fill:#18213d}
      .t{font:14px Arial,sans-serif;fill:#39445a}.label{font:14px Arial,sans-serif;fill:#202838}.small{font:12.5px Arial,sans-serif;fill:#526077}
      .card{fill:#fff;stroke:#aeb9ca;stroke-width:2}.note{fill:#eef4ff;stroke:#4472c4;stroke-width:2}.grid{stroke:#d8dee9;stroke-width:1}
    </style>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#18213d" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text class="title" x="42" y="44">TACO zero-shot diagnostic: the largest class-confusion pairs</text>
  <text class="small" x="42" y="70">Ground truth → prediction · greedy all-class matching at IoU ≥ 0.50 · frozen confidence threshold 0.25</text>

  <g filter="url(#s)">
    <rect class="card" x="42" y="96" width="250" height="108" rx="15"/>
    <text class="big" x="167" y="142" text-anchor="middle">249</text>
    <text class="h" x="167" y="171" text-anchor="middle">localized matches</text>
    <text class="small" x="167" y="192" text-anchor="middle">across all predicted classes</text>

    <rect class="card" x="322" y="96" width="250" height="108" rx="15"/>
    <text class="big" x="447" y="142" text-anchor="middle">53</text>
    <text class="h" x="447" y="171" text-anchor="middle">correct class</text>
    <text class="small" x="447" y="192" text-anchor="middle">21.3% of localized matches</text>

    <rect class="card" x="602" y="96" width="250" height="108" rx="15"/>
    <text class="big" x="727" y="142" text-anchor="middle">196</text>
    <text class="h" x="727" y="171" text-anchor="middle">wrong class</text>
    <text class="small" x="727" y="192" text-anchor="middle">45 non-zero confusion pairs</text>

    <rect class="note" x="882" y="96" width="276" height="108" rx="15"/>
    <text class="h" x="1020" y="139" text-anchor="middle">Diagnostic only</text>
    <text class="small" x="1020" y="166" text-anchor="middle">not a replacement for COCO AP</text>
    <text class="small" x="1020" y="187" text-anchor="middle">and not target-domain validation</text>
  </g>

  <text class="h" x="42" y="245">Top ten wrong-class pairs</text>
  <line class="grid" x1="382" y1="270" x2="382" y2="650"/>
  <line class="grid" x1="566" y1="270" x2="566" y2="650"/>
  <line class="grid" x1="750" y1="270" x2="750" y2="650"/>
  <line class="grid" x1="934" y1="270" x2="934" y2="650"/>
  <line class="grid" x1="1118" y1="270" x2="1118" y2="650"/>
  <text class="small" x="382" y="670" text-anchor="middle">0</text>
  <text class="small" x="566" y="670" text-anchor="middle">8</text>
  <text class="small" x="750" y="670" text-anchor="middle">16</text>
  <text class="small" x="934" y="670" text-anchor="middle">24</text>
  <text class="small" x="1118" y="670" text-anchor="middle">32 cases</text>

  <g>
    <text class="label" x="360" y="293" text-anchor="end">other_litter → food_wrapper</text>
    <rect x="382" y="276" width="713" height="24" rx="6" fill="#4472c4"/><text class="label" x="1106" y="293">31</text>
    <text class="label" x="360" y="329" text-anchor="end">other_litter → metal_can</text>
    <rect x="382" y="312" width="414" height="24" rx="6" fill="#4472c4"/><text class="label" x="807" y="329">18</text>
    <text class="label" x="360" y="365" text-anchor="end">other_litter → plastic_bag</text>
    <rect x="382" y="348" width="391" height="24" rx="6" fill="#4472c4"/><text class="label" x="784" y="365">17</text>
    <text class="label" x="360" y="401" text-anchor="end">other_litter → disposable_cup</text>
    <rect x="382" y="384" width="345" height="24" rx="6" fill="#4472c4"/><text class="label" x="738" y="401">15</text>
    <text class="label" x="360" y="437" text-anchor="end">other_litter → plastic_bottle</text>
    <rect x="382" y="420" width="230" height="24" rx="6" fill="#4472c4"/><text class="label" x="623" y="437">10</text>
    <text class="label" x="360" y="473" text-anchor="end">disposable_cup → metal_can</text>
    <rect x="382" y="456" width="207" height="24" rx="6" fill="#1b998b"/><text class="label" x="600" y="473">9</text>
    <text class="label" x="360" y="509" text-anchor="end">cardboard → food_wrapper</text>
    <rect x="382" y="492" width="207" height="24" rx="6" fill="#1b998b"/><text class="label" x="600" y="509">9</text>
    <text class="label" x="360" y="545" text-anchor="end">cardboard → metal_can</text>
    <rect x="382" y="528" width="138" height="24" rx="6" fill="#1b998b"/><text class="label" x="531" y="545">6</text>
    <text class="label" x="360" y="581" text-anchor="end">food_wrapper → plastic_bag</text>
    <rect x="382" y="564" width="138" height="24" rx="6" fill="#1b998b"/><text class="label" x="531" y="581">6</text>
    <text class="label" x="360" y="617" text-anchor="end">glass_bottle → plastic_bottle</text>
    <rect x="382" y="600" width="138" height="24" rx="6" fill="#1b998b"/><text class="label" x="531" y="617">6</text>
  </g>

  <rect class="note" x="42" y="702" width="1116" height="40" rx="10"/>
  <text class="small" x="600" y="727" text-anchor="middle">The catch-all other_litter class maps diverse TACO labels to one prompt, so these pairs expose both model error and ontology mismatch.</text>
</svg>
