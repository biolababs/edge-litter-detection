<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Public-model bootstrap and target-domain adaptation lifecycle</title>
  <desc id="desc">A public checkpoint enables immediate functional use while a separate evidence-gated lifecycle produces an accepted target-domain checkpoint.</desc>
  <defs>

  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .group{fill:#ffffff;stroke:#374151;stroke-width:1.5}
    .boundary{fill:#f8fafc;stroke:#111827;stroke-width:1.8}
    .node{fill:#ffffff;stroke:#4b5563;stroke-width:1.35}
    .soft{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.25}
    .accent{fill:#eaf0f8;stroke:#2f5597;stroke-width:1.5}
    .safety{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}
    .gate{fill:#ffffff;stroke:#111827;stroke-width:1.6}
    .arrow{fill:none;stroke:#374151;stroke-width:1.6;marker-end:url(#arrow)}
    .feedback{fill:none;stroke:#4b5563;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    .blocked{fill:none;stroke:#9a3412;stroke-width:1.8;stroke-dasharray:7 5}
    .axis{stroke:#6b7280;stroke-width:1}
    .grid{stroke:#d1d5db;stroke-width:1}
    .section{font-size:18px;font-weight:700;letter-spacing:.3px}
    .label{font-size:17px}
    .small{font-size:16.5px;fill:#374151}
    .tiny{font-size:14px;fill:#4b5563}
    .number{font-size:13px;font-weight:700;fill:#ffffff}
    .metric{font-size:21px;font-weight:700}
    .panel{font-size:20px;font-weight:700}
    .bar1{fill:#2f5597}
    .bar2{fill:#64748b}
    .bar3{fill:#94a3b8}
    .bar4{fill:#cbd5e1}
    .bar5{fill:#e5e7eb;stroke:#9ca3af;stroke-width:.7}
  </style>

    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="510" fill="#ffffff"/>
<rect class="accent" x="35" y="80" width="175" height="78" rx="0"/>
<circle cx="47" cy="92" r="11" fill="#2f5597"/><text class="number" x="47" y="96.5" text-anchor="middle">1</text>
<text class="small" x="122" y="111" text-anchor="middle">Pinned public</text>
<text class="small" x="122" y="131" text-anchor="middle">checkpoint</text>
<rect class="node" x="255" y="80" width="175" height="78" rx="0"/>
<circle cx="267" cy="92" r="11" fill="#2f5597"/><text class="number" x="267" y="96.5" text-anchor="middle">2</text>
<text class="small" x="342" y="111" text-anchor="middle">Bootstrap use</text>
<text class="small" x="342" y="131" text-anchor="middle">and data capture</text>
<rect class="node" x="475" y="80" width="175" height="78" rx="0"/>
<circle cx="487" cy="92" r="11" fill="#2f5597"/><text class="number" x="487" y="96.5" text-anchor="middle">3</text>
<text class="small" x="562" y="111" text-anchor="middle">Representative</text>
<text class="small" x="562" y="131" text-anchor="middle">labelled data</text>
<rect class="node" x="695" y="80" width="175" height="78" rx="0"/>
<circle cx="707" cy="92" r="11" fill="#2f5597"/><text class="number" x="707" y="96.5" text-anchor="middle">4</text>
<text class="small" x="782" y="111" text-anchor="middle">Train / adapt</text>
<text class="small" x="782" y="131" text-anchor="middle">checkpoint</text>
<rect class="node" x="915" y="80" width="220" height="78" rx="0"/>
<circle cx="927" cy="92" r="11" fill="#2f5597"/><text class="number" x="927" y="96.5" text-anchor="middle">5</text>
<text class="small" x="1025" y="111" text-anchor="middle">Frozen validation</text>
<text class="small" x="1025" y="131" text-anchor="middle">detection · count · system</text>
<path class="arrow" d="M210 119 L255 119"/>
<path class="arrow" d="M430 119 L475 119"/>
<path class="arrow" d="M650 119 L695 119"/>
<path class="arrow" d="M870 119 L915 119"/>
<rect class="gate" x="490" y="250" width="220" height="82" rx="0"/>
<text class="small" x="600" y="281" text-anchor="middle">Release gate</text>
<text class="small" x="600" y="302" text-anchor="middle">predeclared acceptance criteria</text>
<path class="arrow" d="M1025 158 L1025 205 L600 205 L600 250"/>
<rect class="accent" x="850" y="390" width="285" height="78" rx="0"/>
<text class="small" x="992" y="420" text-anchor="middle">Versioned accepted checkpoint</text>
<text class="small" x="992" y="441" text-anchor="middle">same downstream detection contract</text>
<path class="arrow" d="M710 291 L992 291 L992 390"/>
<text class="small" x="840" y="278" text-anchor="middle">PASS</text>
<path class="feedback" d="M490 291 L430 291 L430 210 L782 210 L782 158"/>
<text class="small" x="455" y="278" text-anchor="end">FAIL</text>
<text class="tiny" x="455" y="326" text-anchor="end">revise data / prompt / model</text>
<rect class="soft" x="35" y="390" width="320" height="78" rx="0"/>
<text class="small" x="195" y="420" text-anchor="middle">Public model remains available</text>
<text class="small" x="195" y="441" text-anchor="middle">for installation, review and data collection</text>
<path class="feedback" d="M342 158 L342 350 L195 350 L195 390"/>
</svg>
