<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Jetson Orin Nano full-pipeline latency profile</title>
  <desc id="desc">A scientific stacked bar and throughput comparison summarize three warmed Jetson full-pipeline runs.</desc>
  <defs>

  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .group{fill:#ffffff;stroke:#374151;stroke-width:1.5}
    .boundary{fill:#f8fafc;stroke:#111827;stroke-width:1.8}
    .node{fill:#ffffff;stroke:#4b5563;stroke-width:1.35}
    .soft{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.25}
    .accent{fill:#eaf0f8;stroke:#2f5597;stroke-width:1.5}
    .safety{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}
    .gate{fill:#ffffff;stroke:#111827;stroke-width:1.6}
    .arrow{fill:none;stroke:#374151;stroke-width:1.6;marker-end:url(#arrow)}
    .feedback{fill:none;stroke:#4b5563;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    .blocked{fill:none;stroke:#9a3412;stroke-width:1.8;stroke-dasharray:7 5}
    .axis{stroke:#6b7280;stroke-width:1}
    .grid{stroke:#d1d5db;stroke-width:1}
    .section{font-size:18px;font-weight:700;letter-spacing:.3px}
    .label{font-size:17px}
    .small{font-size:16.5px;fill:#374151}
    .tiny{font-size:14px;fill:#4b5563}
    .number{font-size:13px;font-weight:700;fill:#ffffff}
    .metric{font-size:21px;font-weight:700}
    .panel{font-size:20px;font-weight:700}
    .bar1{fill:#2f5597}
    .bar2{fill:#64748b}
    .bar3{fill:#94a3b8}
    .bar4{fill:#cbd5e1}
    .bar5{fill:#e5e7eb;stroke:#9ca3af;stroke-width:.7}
  </style>

    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="540" fill="#ffffff"/>
<text class="panel" x="50" y="45" text-anchor="start">(a) EXCLUSIVE WALL-TIME SHARE</text>
<text class="small" x="50" y="73" text-anchor="start">Mean across three warmed 300-frame full-pipeline runs</text>
<rect class="bar1" x="75" y="125" width="540.3599999999999" height="62"/>
<text x="345.17999999999995" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Model forward</text>
<text x="345.17999999999995" y="174" text-anchor="middle" font-size="13" fill="#ffffff">71.10%</text>
<rect class="bar2" x="615.3599999999999" y="125" width="104.044" height="62"/>
<rect class="bar3" x="719.4039999999999" y="125" width="80.484" height="62"/>
<rect class="bar4" x="799.8879999999999" y="125" width="19.608" height="62"/>
<rect class="bar5" x="819.4959999999999" y="125" width="15.504000000000001" height="62"/>
<rect class="bar1" x="75" y="210" width="14" height="14"/>
<text class="tiny" x="96" y="222" text-anchor="start">Model forward 71.10%</text>
<rect class="bar2" x="280" y="210" width="14" height="14"/>
<text class="tiny" x="301" y="222" text-anchor="start">Preprocess 13.69%</text>
<rect class="bar3" x="470" y="210" width="14" height="14"/>
<text class="tiny" x="491" y="222" text-anchor="start">Annotation/output 10.59%</text>
<rect class="bar4" x="690" y="210" width="14" height="14"/>
<text class="tiny" x="711" y="222" text-anchor="start">Postprocess 2.58%</text>
<rect class="bar5" x="75" y="238" width="14" height="14"/>
<text class="tiny" x="96" y="250" text-anchor="start">Capture, tracking, SQLite, JSONL and other 2.04%</text>
<text class="panel" x="50" y="302" text-anchor="start">(b) THROUGHPUT AGAINST PROVISIONAL TARGET</text>
<text class="label" x="75" y="357" text-anchor="start">Measured</text>
<rect class="bar1" x="190" y="337" width="179.84026666666668" height="28"/>
<text class="small" x="381.8402666666667" y="357" text-anchor="start">5.188 FPS</text>
<text class="label" x="75" y="407" text-anchor="start">Target</text>
<rect x="190" y="387" width="520" height="28" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text class="small" x="722" y="407" text-anchor="start">15 FPS</text>
<path class="axis" d="M190 437 L710 437"/>
<text class="tiny" x="190" y="460" text-anchor="middle">0</text>
<text class="tiny" x="363" y="460" text-anchor="middle">5</text>
<text class="tiny" x="537" y="460" text-anchor="middle">10</text>
<text class="tiny" x="710" y="460" text-anchor="middle">15 FPS</text>
<rect class="group" x="880" y="95" width="270" height="315" rx="0"/>
<text class="section" x="905" y="130" text-anchor="start">Measured condition</text>
<text class="small" x="905" y="165" text-anchor="start">Jetson Orin Nano 8 GB</text>
<text class="small" x="905" y="194" text-anchor="start">3 × 300 frames</text>
<text class="small" x="905" y="223" text-anchor="start">10 warm-up calls/run</text>
<text class="small" x="905" y="252" text-anchor="start">mean detector call: 168.62 ms</text>
<text class="small" x="905" y="281" text-anchor="start">population SD: 0.0104 FPS</text>
<text class="small" x="905" y="310" text-anchor="start">whole-board mean: 12.70 W</text>
<text class="small" x="905" y="339" text-anchor="start">peak GPU temperature: 63.94 °C</text>
<text class="small" x="600" y="505" text-anchor="middle">Model forward + preprocessing + annotation/output = 95.38% of measured wall time.</text>
</svg>
